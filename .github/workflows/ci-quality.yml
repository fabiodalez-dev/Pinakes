name: Code Quality

# Fast static-analysis checks: dependency CVEs, translation drift,
# route integrity, Tailwind JIT safety, plugin schema rules.
# No database or browser required — runs in ~60 seconds.

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - '**.js'
      - 'locale/**'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/**/*.js'
      - 'frontend/**/*.css'
      - 'public/assets/**'
      - 'scripts/ci-*'
      - 'tests/*.test.sh'
      - 'tests/ci-playwright-policy.json'
      - 'installer/database/schema.sql'
      - 'version.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality checks
    runs-on: ubuntu-latest

    # MySQL for the DB-backed unit tests (migration-*, book-field-types,
    # loan-edge-cases, session-fixes). Without it those tests can't read a DB
    # and would abort — the migration behavioural tests are mandatory per
    # updater.md, so CI provides a real database instead of skipping them.
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pinakes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Install pinned PHPStan with verified Composer transport
        run: |
          PHPSTAN_HOME=$(mktemp -d "${RUNNER_TEMP}/pinakes-phpstan.XXXXXX")
          installed=0
          for attempt in 1 2 3; do
            if COMPOSER_HOME="$PHPSTAN_HOME" composer global require \
              --no-interaction --prefer-dist --no-progress \
              phpstan/phpstan:2.1.56; then
              installed=1
              break
            fi
            echo "PHPStan install attempt ${attempt}/3 failed"
            sleep $((attempt * 2))
          done
          [ "$installed" -eq 1 ] || { echo "PHPStan installation failed after 3 attempts"; exit 1; }
          PHPSTAN_BIN="${PHPSTAN_HOME}/vendor/bin/phpstan"
          [ -x "$PHPSTAN_BIN" ] || { echo "PHPStan executable missing after install"; exit 1; }
          "$PHPSTAN_BIN" --version
          echo "PHPSTAN_BIN=$PHPSTAN_BIN" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Setup Go for workflow validation
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false

      # ── Dependency CVE scanning ───────────────────────────────────────────
      - name: composer audit (known CVEs)
        run: |
          composer install --no-interaction --prefer-dist --quiet
          composer audit --no-dev --abandoned=ignore 2>&1 || { echo "⚠ composer audit: vulnerabilities found (see above)"; exit 1; }

      - name: npm audit (known CVEs)
        run: |
          npm ci --silent
          npm audit --audit-level=high 2>&1 || { echo "⚠ npm audit: high/critical vulnerabilities found"; exit 1; }

      - name: Root vendor assets are reproducible
        run: |
          git diff --exit-code -- public/assets/vendor/sortablejs
          test -z "$(git ls-files --others --exclude-standard -- public/assets/vendor/sortablejs)" || {
            echo "Generated vendor assets contain untracked files"
            git ls-files --others --exclude-standard -- public/assets/vendor/sortablejs
            exit 1
          }

      - name: CI and Playwright coverage policy
        run: npm run test:ci-policy

      - name: Release source policy regression tests
        run: bash tests/release-source-policy.test.sh

      - name: Validate every active GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      # ── Translation completeness ──────────────────────────────────────────
      - name: Translation and route parity (all supported locales)
        run: python3 scripts/ci-check-locales.py

      - name: PHPStan (level from phpstan.neon)
        run: |
          "$PHPSTAN_BIN" analyse --no-progress --memory-limit=512M

      # ── Route key integrity ───────────────────────────────────────────────
      - name: Route key integrity (route_path() keys exist in routes_it_IT.json)
        run: |
          ROUTE_KEYS=$(python3 -c "import json; d=json.load(open('locale/routes_it_IT.json')); [print(k) for k in d.keys()]")
          FALLBACK_KEYS=$(php -r "require 'vendor/autoload.php'; echo implode(PHP_EOL, App\\Support\\RouteTranslator::getStaticFallbackKeys());")
          ALL_KEYS=$(printf '%s\n%s' "$ROUTE_KEYS" "$FALLBACK_KEYS" | sort -u)
          FAILED=0
          while IFS= read -r key; do
            if ! echo "$ALL_KEYS" | grep -qx "$key"; then
              echo "  ✗ route_path('$key') usato in views ma mancante in routes_it_IT.json o fallbackRoutes"
              FAILED=1
            fi
          done < <(grep -rohE "route_path\('([^']+)'\)" app/Views/ | grep -oE "'[^']+'" | tr -d "'" | sort -u)
          [ "$FAILED" -eq 0 ] && echo "✓ Tutte le chiavi route_path() esistono in routes_it_IT.json o fallbackRoutes" || exit 1

      # ── Tailwind JIT safety ───────────────────────────────────────────────
      - name: Tailwind JIT — no dynamic class construction
        run: |
          VIOLATIONS=$(grep -rn \
            -e "'bg-'\s*\.\s*\$" \
            -e '"bg-"\s*\.\s*\$' \
            -e "'text-'\s*\.\s*\$" \
            -e '"text-"\s*\.\s*\$' \
            -e "'border-'\s*\.\s*\$" \
            -e '"border-"\s*\.\s*\$' \
            --include="*.php" app/ storage/plugins/ 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "✗ Classi Tailwind costruite dinamicamente (non generate dal JIT):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✓ Nessuna classe Tailwind dinamica trovata"

      # ── Plugin ensureSchema() rule ────────────────────────────────────────
      - name: Plugin ensureSchema() rule (CLAUDE.md absolute rule)
        run: |
          FAILED=0
          for file in storage/plugins/*/*.php; do
            [ -f "$file" ] || continue
            plugin_file="$(basename "$(dirname "$file")")/$(basename "$file")"
            if grep -q 'CREATE TABLE' "$file"; then
              if ! grep -q 'ensureSchema()' "$file"; then
                echo "  ✗ ${plugin_file}: CREATE TABLE senza ensureSchema()"
                FAILED=1
              elif ! awk '/function onActivate/,/^    }$/' "$file" | grep -q 'ensureSchema'; then
                echo "  ✗ ${plugin_file}: ensureSchema() non in onActivate()"
                FAILED=1
              elif ! awk '/function onInstall/,/^    }$/' "$file" | grep -q 'ensureSchema'; then
                echo "  ✗ ${plugin_file}: ensureSchema() non in onInstall()"
                FAILED=1
              else
                echo "  ✓ ${plugin_file}"
              fi
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      # ── Soft-delete guard ─────────────────────────────────────────────────
      - name: Soft-delete guard (libri queries must include deleted_at IS NULL)
        run: python3 scripts/ci-check-soft-delete.py app storage/plugins installer

      # ── Autoloader safety ─────────────────────────────────────────────────
      - name: Autoloader phpstan-free
        run: |
          if [ -f vendor/composer/autoload_static.php ]; then
            COUNT=$(grep -c "phpstan" vendor/composer/autoload_static.php || true)
            COUNT=${COUNT:-0}
            if [ "$COUNT" -gt 0 ]; then
              echo "✗ autoload_static.php contiene $COUNT riferimenti a phpstan (run composer install --no-dev)"
              exit 1
            fi
            echo "✓ autoloader phpstan-free"
          else
            echo "ℹ vendor/ not installed — skipping"
          fi

      # ── Migration version guard ───────────────────────────────────────────
      - name: Migration version guard (all migrate_*.sql ≤ version.json)
        run: |
          TARGET=$(php -r "echo json_decode(file_get_contents('version.json'))->version;")
          FAILED=0
          for f in installer/database/migrations/migrate_*.sql; do
            migration_file="$(basename "$f")"
            V="${migration_file#migrate_}"
            V="${V%.sql}"
            if ! MIGRATION_VERSION="$V" RELEASE_VERSION="$TARGET" php -r \
              'exit(version_compare(getenv("MIGRATION_VERSION"), getenv("RELEASE_VERSION"), "<=") ? 0 : 1);'; then
              echo "  ✗ ${migration_file}: $V > $TARGET (sarebbe ignorata dall'updater)"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] && echo "✓ Tutte le migration hanno versione ≤ $TARGET" || exit 1

      # DB-backed unit tests (migration-*, book-field-types, loan-edge-cases,
      # session-fixes) read credentials from .env and connect over TCP. Provide
      # a CI .env pointing at the MySQL service and load the base schema so the
      # migration behavioural tests run against a real, current-schema database.
      - name: Prepare DB for unit tests (.env + schema)
        run: |
          cat > .env <<'ENVEOF'
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASS=root
          DB_NAME=pinakes_test
          ENVEOF
          # Wait until MySQL answers, then import the base schema + triggers.
          for _ in $(seq 1 30); do
            mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          mysql -h 127.0.0.1 -u root -proot pinakes_test < installer/database/schema.sql
          # Exercise the unit suite against the same baseline as a completed
          # Italian install. The schema alone contains no default language or
          # bundled-plugin registrations, which used to turn real regressions
          # into silent SKIP results.
          mysql -h 127.0.0.1 -u root -proot pinakes_test < installer/database/data_it_IT.sql
          # Copy-occupancy triggers live in a separate file (DELIMITER-based); the
          # mysql CLI handles DELIMITER natively. loan-edge-cases relies on them.
          mysql -h 127.0.0.1 -u root -proot pinakes_test < installer/database/triggers.sql
          # PHP variables must not expand in Bash.
          # shellcheck disable=SC2016
          php -r '
            require "vendor/autoload.php";
            $db = new mysqli("127.0.0.1", "root", "root", "pinakes_test", 3306);
            $db->set_charset("utf8mb4");
            $hooks = new App\Support\HookManager($db);
            (new App\Support\PluginManager($db, $hooks))->autoRegisterBundledPlugins();
          '
          default_languages="$(mysql -h 127.0.0.1 -u root -proot -Nse \
            'SELECT COUNT(*) FROM pinakes_test.languages WHERE is_default=1')"
          book_club_plugins="$(mysql -h 127.0.0.1 -u root -proot -Nse \
            'SELECT COUNT(*) FROM pinakes_test.plugins WHERE name=0x626f6f6b2d636c7562')"
          test "${default_languages}" = "1"
          test "${book_club_plugins}" = "1"

      - name: PHP unit tests (standalone .unit.php)
        env:
          CI_STRICT_TESTS: '1'
        run: bash scripts/ci-run-unit-tests.sh

      - name: Schema and migration behavioral gate (strict no-skip mode)
        env:
          CI_STRICT_TESTS: '1'
        run: bash scripts/verify-schema.sh

      # Exercise the plugin ZIP-update path against a real DB. The synthetic
      # test covers install→update on a disposable plugin; the all-bundled test
      # updates EVERY registered bundled plugin in place and restores it, so a
      # broken update path surfaces here before it reaches an operator's admin
      # UI. Runs after the schema gate so that gate sees pristine plugin data;
      # the all-bundled test restores every directory and plugins-row version.
      - name: PHP plugin ZIP-update integration tests
        env:
          CI_STRICT_TESTS: '1'
        run: |
          php tests/plugin-zip-update.integration.php
          php tests/plugin-zip-update-all-bundled.integration.php

      - name: Shell test — bin/setup-permissions.sh
        run: bash tests/setup-permissions.test.sh

      - name: Remove CI .env
        if: always()
        run: rm -f .env

  php-compatibility:
    name: PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, mbstring, curl, intl, xml
          coverage: none
      - name: Validate and install locked dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: PHP syntax check (application, installer, plugins, tests)
        run: |
          find app installer storage/plugins tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  frontend:
    name: Frontend audit, lint and reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install and audit locked dependencies
        run: |
          npm ci --silent
          npm audit --audit-level=high
          npm --prefix frontend ci --silent
          npm --prefix frontend audit --audit-level=high
      - name: Lint and production build
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run build
      - name: Verify generated assets are committed and reproducible
        run: |
          git diff --exit-code -- public/assets
          untracked_assets="$(git ls-files --others --exclude-standard -- public/assets)"
          if [ -n "${untracked_assets}" ]; then
            echo "Generated assets are untracked:"
            echo "${untracked_assets}"
            exit 1
          fi
