name: Security and Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow, YAML and shell security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Read workflow and script sources.
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Audit GitHub Actions with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          persona: pedantic

      - name: Setup Go for actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Validate workflow semantics with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Validate YAML structure with yamllint
        run: |
          python3 -m pip install --disable-pip-version-check --no-input yamllint==1.37.1
          yamllint .github .yamllint.yml

      - name: Analyze maintained shell scripts with ShellCheck
        run: |
          mapfile -t shell_scripts < <(git ls-files '*.sh')
          test "${#shell_scripts[@]}" -gt 0
          shellcheck --severity=warning -x "${shell_scripts[@]}"

  dependency-review:
    name: Dependency diff policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Compare dependency manifests in the pull request.
    steps:
      - name: Reject vulnerable or forbidden new dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          vulnerability-check: true
          license-check: true
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, BUSL-1.1, SSPL-1.0
          show-openssf-scorecard: true

  repository-security:
    name: Secrets, vulnerabilities and misconfigurations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # Scan the repository and complete Git history.
    steps:
      - name: Checkout complete history without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Scan dependencies, secrets and IaC with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          skip-dirs: vendor,node_modules,frontend/node_modules,public/assets/tinymce
          version: v0.73.0

  release-artifact:
    name: Reproducible release, SBOM and archive audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read # Build the release from checked-out sources.
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, mbstring, curl, intl, xml, zip
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install locked production inputs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq rsync unzip zip
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci --silent
          npm --prefix frontend ci --silent
          npm --prefix frontend run build

      - name: Verify generated assets match the commit
        run: git diff --exit-code -- public/assets

      - name: Build the release twice and require byte-for-byte reproducibility
        run: |
          bash bin/build-release.sh --skip-build
          version=$(jq -r .version version.json)
          first_hash=$(sha256sum "releases/pinakes-v${version}.zip" | cut -d' ' -f1)
          bash bin/build-release.sh --skip-build
          second_hash=$(sha256sum "releases/pinakes-v${version}.zip" | cut -d' ' -f1)
          test "$first_hash" = "$second_hash" || {
            echo "Release is not reproducible: $first_hash != $second_hash"
            exit 1
          }

      - name: Verify the exact distributable ZIP
        run: |
          version=$(jq -r .version version.json)
          bash scripts/ci-verify-release.sh "releases/pinakes-v${version}.zip"
          mkdir release-under-test
          unzip -q "releases/pinakes-v${version}.zip" -d release-under-test

      - name: Scan packaged release with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: release-under-test
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          version: v0.73.0

      - name: Generate SPDX JSON SBOM for the packaged release
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-under-test
          format: spdx-json
          output-file: releases/pinakes.spdx.json
          upload-artifact: false

      - name: Upload verified release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-release-${{ github.sha }}
          path: |
            releases/*.zip
            releases/*.sha256
            releases/*.spdx.json
            releases/RELEASE_NOTES-*.md
          if-no-files-found: error
          retention-days: 30
